# CONFIG_CPU_FREQ is not set

# Force built-in (not module) so /dev/uioN exists before userspace starts --
# meta-openamp's openamp.cfg also sets this symbol and merges after loose
# user_*.cfg fragments, downgrading a plain user cfg's =y to =m.
CONFIG_UIO_PDRV_GENIRQ=y

# No loadable modules: without module signing, module loading is a path
# around secure boot. Nothing on the target loads a module (lsmod empty on a
# running unit; units run fine with /lib/modules removed), and the drivers
# the app does use (uio_pdrv_genirq, xilinx-axipmon) are built in.
# CONFIG_MODULES is not set

# With CONFIG_MODULES off, Kconfig promotes any remaining =m to =y rather
# than dropping it, so every symbol that was =m is explicitly disabled here.
# This list is the =m set from the running kernel's /proc/config.gz. Kept in
# bsp.cfg (a KERNEL_FEATURE) so meta-openamp's openamp.cfg can't re-enable
# them, as with CONFIG_UIO_PDRV_GENIRQ above.
